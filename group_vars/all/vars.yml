---
# Версія Elasticsearch
es_version: "8.13.4"

# Назва кластера
es_cluster_name: "junior-devops-cluster"

# Шляхи
es_data_path: "/var/lib/elasticsearch"
es_logs_path: "/var/log/elasticsearch"
es_certs_dir: "/etc/elasticsearch/certs"

# Heap для JVM (для тестових VM 1g ок; правило — не більше 50% RAM)
es_heap_size: "1g"

# HTTP порт
es_http_port: 9200
es_transport_port: 9300

# Термін дії сертифікатів (днів)
es_cert_validity_days: 3650

# Паролі — з vault (зашифровані). Поки що залишимо placeholder.
es_elastic_password: "{{ vault_es_elastic_password }}"
es_kibana_password: "{{ vault_es_kibana_password }}"
