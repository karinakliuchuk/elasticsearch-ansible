---
- name: Ensure Elasticsearch is running
  systemd:
    name: elasticsearch
    state: started
    enabled: yes

- name: Wait for Elasticsearch port
  wait_for:
    host: "{{ es_ip }}"
    port: "{{ es_http_port }}"
    delay: 5
    timeout: 120

- name: Verify cluster is healthy
  uri:
    url: "https://{{ es_ip }}:{{ es_http_port }}/_cluster/health?wait_for_status=yellow&timeout=60s"
    method: GET
    user: elastic
    password: "{{ es_elastic_password }}"
    validate_certs: no
    status_code: 200
  retries: 15
  delay: 10
  no_log: true
  run_once: true
