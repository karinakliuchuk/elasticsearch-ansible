---
- name: Ensure certs directory exists
  file:
    path: "{{ es_certs_dir }}"
    state: directory
    owner: root
    group: elasticsearch
    mode: "0750"
- block:
    - name: Generate CA (elastic-stack-ca.p12)
      command: >
        /usr/share/elasticsearch/bin/elasticsearch-certutil ca
        --silent
        --out {{ es_certs_dir }}/elastic-stack-ca.p12
        --pass ""
      args:
        creates: "{{ es_certs_dir }}/elastic-stack-ca.p12"

    - name: Generate single certificate with SANs via command-line flags
      command: >
        /usr/share/elasticsearch/bin/elasticsearch-certutil cert
        --silent
        --ca {{ es_certs_dir }}/elastic-stack-ca.p12
        --ca-pass ""
        --out {{ es_certs_dir }}/elastic-certificates.p12
        --pass ""
        --name instance
        --dns localhost
        {% for host in groups['es_nodes'] %}--dns {{ host }} {% endfor %}
        {% for host in groups['es_nodes'] %}--ip {{ hostvars[host].es_ip }} {% endfor %}
      args:
        creates: "{{ es_certs_dir }}/elastic-certificates.p12"

    - name: Verify certificate file is a valid PKCS12
      command: >
        /usr/share/elasticsearch/jdk/bin/keytool -list
        -keystore {{ es_certs_dir }}/elastic-certificates.p12
        -storepass "" -storetype PKCS12
      register: cert_check
      changed_when: false
      failed_when: cert_check.rc != 0

    - name: Verify certificate has SANs
      command: >
        /usr/share/elasticsearch/jdk/bin/keytool -list -v
        -keystore {{ es_certs_dir }}/elastic-certificates.p12
        -storepass "" -storetype PKCS12
      register: cert_san_check
      changed_when: false
      failed_when: "'SubjectAlternativeName' not in cert_san_check.stdout"

    - name: Set ownership on generated certs
      file:
        path: "{{ es_certs_dir }}/{{ item }}"
        owner: root
        group: elasticsearch
        mode: "0640"
      loop:
        - elastic-stack-ca.p12
        - elastic-certificates.p12

    - name: Fetch certs to Ansible controller
      fetch:
        src: "{{ es_certs_dir }}/{{ item }}"
        dest: /tmp/es-certs/
        flat: yes
      loop:
        - elastic-stack-ca.p12
        - elastic-certificates.p12
  when: inventory_hostname == groups['es_nodes'][0]

- name: Distribute certs to non-first nodes
  copy:
    src: "/tmp/es-certs/{{ item }}"
    dest: "{{ es_certs_dir }}/{{ item }}"
    owner: root
    group: elasticsearch
    mode: "0640"
  loop:
    - elastic-stack-ca.p12
    - elastic-certificates.p12
  when: inventory_hostname != groups['es_nodes'][0]
