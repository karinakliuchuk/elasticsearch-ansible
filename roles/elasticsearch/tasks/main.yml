---
- name: Install dependencies for adding apt repo
  apt:
    name:
      - apt-transport-https
      - gnupg
      - curl
    state: present

- name: Add Elastic GPG key
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: Add Elastic 8.x apt repository
  apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/8.x/apt stable main"
    state: present
    filename: elastic-8.x

- name: Install Elasticsearch
  apt:
    name: "elasticsearch={{ es_version }}"
    state: present
    update_cache: yes

- name: Deploy elasticsearch.yml
  template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: "0660"

- name: Deploy JVM heap options
  template:
    src: jvm.options.j2
    dest: /etc/elasticsearch/jvm.options.d/heap.options
    owner: root
    group: elasticsearch
    mode: "0644"

- name: Enable Elasticsearch service (do not start yet)
  systemd:
    name: elasticsearch
    enabled: yes
    daemon_reload: yes

- name: Ensure bootstrap.password in ES keystore
  shell: |
    if ! /usr/share/elasticsearch/bin/elasticsearch-keystore list 2>/dev/null | grep -q '^bootstrap.password$'; then
      echo "{{ es_elastic_password }}" | /usr/share/elasticsearch/bin/elasticsearch-keystore add -x bootstrap.password
    fi
  no_log: true

- name: Remove ES auto-configuration secure_password entries
  shell: |
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.http.ssl.keystore.secure_password 2>/dev/null || true
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.transport.ssl.keystore.secure_password 2>/dev/null || true
    /usr/share/elasticsearch/bin/elasticsearch-keystore remove xpack.security.transport.ssl.truststore.secure_password 2>/dev/null || true
  changed_when: false

- name: Remove auto-generated ES certificate files
  file:
    path: "/etc/elasticsearch/certs/{{ item }}"
    state: absent
  loop:
    - http.p12
    - transport.p12
    - http_ca.crt
